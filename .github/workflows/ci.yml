name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0, net11.0]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
        ./dotnet-install.ps1 -JSonFile src/global.json -InstallDir "$env:ProgramFiles\dotnet"
        ./dotnet-install.ps1 -Channel 10.0 -Runtime dotnet -InstallDir "$env:ProgramFiles\dotnet"
        echo "$env:ProgramFiles\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        dotnet --list-sdks

    - name: Restore
      working-directory: src
      run: dotnet restore CloudNimble.XmlEssentials.slnx

    - name: Build
      working-directory: src
      run: dotnet build CloudNimble.XmlEssentials.slnx -c Release --no-restore

    - name: Test with coverage
      working-directory: src
      run: dotnet test CloudNimble.XmlEssentials.slnx -c Release --no-build -f ${{ matrix.tfm }} --coverage --coverage-output-format cobertura --coverage-output ../artifacts/coverage/coverage.cobertura.xml

    - name: Coverage gate
      working-directory: src
      run: dotnet run coverage-gate.cs -- ../artifacts/coverage/coverage.cobertura.xml
